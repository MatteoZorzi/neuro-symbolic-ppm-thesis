# The environment the experiments were run in, exported from `tleaf`.
#
#     conda env create -f environment.yml
#     conda activate tleaf
#
# Build strings are dropped so the file is not pinned to this machine. The
# torch wheels carry a +cu128 local version and do not come from PyPI:
#
#     pip install torch==2.7.0+cu128 --index-url https://download.pytorch.org/whl/cu128
#
# Run everything with the environment ACTIVATED, never by calling
# envs/tleaf/python.exe directly. On Windows the BLAS libraries numpy needs
# live in Library/bin, which only activation puts on the DLL search path;
# without it numpy imports fine and then dies on the first matrix product.
name: tleaf
